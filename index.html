<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林佳茹 — 电商视觉设计师 Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #111827;       
    --ink-2: #4B5563;     
    --ink-muted: #9CA3AF; 
    --bg: #F4F5F8;        
    --surface: #FFFFFF;   
    
    --grad-1: #4F46E5;    
    --grad-2: #EC4899;    
    --accent-grad: linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 100%);
    --tag-bg-grad: linear-gradient(135deg, rgba(79, 70, 229, 0.08) 0%, rgba(236, 72, 153, 0.08) 100%);
    
    --sans: 'Poppins', 'Noto Sans SC', system-ui, sans-serif;
  }
  
  html { scroll-behavior: smooth; }
  
  body { 
    font-family: var(--sans); 
    background: var(--bg); 
    color: #111827; 
    font-size: 16px; 
    line-height: 1.6; 
    overflow-x: hidden; 
    position: relative;
  }

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1rem 4rem; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,0,0,0.03); }
  .nav-logo { font-size: 1.3rem; font-weight: 700; text-decoration: none; letter-spacing: 0.05em; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nav-links { display: flex; gap: 3rem; list-style: none; }
  .nav-links a { font-size: 0.9rem; font-weight: 500; color: var(--ink-2); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--grad-1); }

  .hero { min-height: 90vh; display: grid; grid-template-columns: 1.1fr 0.9fr; align-items: center; padding: 6rem 4rem 2rem; gap: 5rem; max-width: 1060px; margin: 0 auto; }
  .hero-eyebrow { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.15em; margin-bottom: 1rem; text-transform: uppercase; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; display: flex; align-items: center; gap: 0.75rem;}
  .hero-eyebrow::before { content: ''; display: block; width: 30px; height: 2px; background: var(--accent-grad); border-radius: 2px; }
  .hero h1 { font-size: clamp(3rem, 5vw, 4.5rem); line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 1.5rem; color: #111827; }
  .hero h1 span { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-sub { font-size: 1.1rem; color: var(--ink-2); max-width: 500px; line-height: 1.8; margin-bottom: 2.5rem; font-weight: 300; }
  .hero-cta { display: inline-flex; align-items: center; justify-content: center; padding: 1rem 2.5rem; background: var(--accent-grad); color: white; text-decoration: none; font-size: 0.95rem; font-weight: 600; border-radius: 50px; box-shadow: 0 8px 20px rgba(79, 70, 229, 0.2); }
  
  .hero-visual { position: relative; display: flex; flex-direction: column; gap: 1.2rem; align-items: flex-end; }
  .hero-card { background: var(--surface); border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 10px 30px rgba(0,0,0,0.04); border-radius: 20px; padding: 1.5rem 2rem; width: 85%; }
  .hero-card:nth-child(2) { width: 75%; border-left: 4px solid var(--grad-1); }
  .card-label { font-size: 0.7rem; font-weight: 700; color: var(--ink-muted); margin-bottom: 0.5rem; text-transform: uppercase; }
  .card-title { font-size: 1.1rem; font-weight: 600; color: #111827; }
  .card-tags { display: flex; gap: 0.5rem; margin-top: 0.8rem; flex-wrap: wrap; }
  .card-tag { font-size: 0.7rem; font-weight: 500; padding: 4px 12px; background: var(--tag-bg-grad); border-radius: 50px; color: var(--grad-1); border: 1px solid rgba(79, 70, 229, 0.1); }

  /* 核心修改：缩减板块垂直留白 */
  section { padding: 4rem 4rem; max-width: 1060px; margin: 0 auto; }
  
  .section-num { font-size: 0.8rem; font-weight: 700; color: var(--grad-2); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; text-transform: uppercase; }
  .section-title { font-size: clamp(2rem, 3.5vw, 2.5rem); font-weight: 700; line-height: 1.2; margin-bottom: 2.5rem; color: #111827; position: relative; display: inline-block;}
  .section-title::after { content: ''; position: absolute; left: 0; bottom: -8px; width: 50px; height: 4px; background: var(--accent-grad); border-radius: 2px; }
