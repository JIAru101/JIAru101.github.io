<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>林佳茹 — 电商视觉设计师 Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --ink: #111827;       
    --ink-2: #4B5563;     
    --ink-muted: #9CA3AF; 
    --bg: #F4F5F8;        
    --surface: #FFFFFF;   
    
    --grad-1: #4F46E5;    
    --grad-2: #EC4899;    
    --accent-grad: linear-gradient(135deg, var(--grad-1) 0%, var(--grad-2) 100%);
    --tag-bg-grad: linear-gradient(135deg, rgba(79, 70, 229, 0.08) 0%, rgba(236, 72, 153, 0.08) 100%);
    
    --sans: 'Poppins', 'Noto Sans SC', system-ui, sans-serif;
  }
  
  html { scroll-behavior: smooth; }
  
  body { 
    font-family: var(--sans); 
    background: var(--bg); 
    color: #111827; 
    font-size: 16px; 
    line-height: 1.6; 
    overflow-x: hidden; 
    position: relative;
  }
  body::before { 
    content: ''; position: absolute; top: -5%; left: -10%; width: 60vw; height: 60vw; 
    background: radial-gradient(circle, rgba(79, 70, 229, 0.08) 0%, transparent 70%); 
    z-index: -1; pointer-events: none;
  }
  body::after { 
    content: ''; position: absolute; top: 25%; right: -10%; width: 50vw; height: 50vw; 
    background: radial-gradient(circle, rgba(236, 72, 153, 0.06) 0%, transparent 70%); 
    z-index: -1; pointer-events: none;
  }

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; padding: 1rem 4rem; background: rgba(255,255,255,0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(0,0,0,0.03); box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
  .nav-logo { font-size: 1.3rem; font-weight: 700; text-decoration: none; letter-spacing: 0.05em; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .nav-links { display: flex; gap: 3rem; list-style: none; }
  .nav-links a { font-size: 0.9rem; font-weight: 500; color: var(--ink-2); text-decoration: none; transition: color 0.2s, transform 0.2s; display: inline-block; }
  .nav-links a:hover { color: var(--grad-1); transform: translateY(-1px); }

  .hero { min-height: 100vh; display: grid; grid-template-columns: 1.1fr 0.9fr; align-items: center; padding: 8rem 4rem 4rem; gap: 5rem; max-width: 1400px; margin: 0 auto; }
  .hero-eyebrow { font-size: 0.85rem; font-weight: 600; letter-spacing: 0.15em; margin-bottom: 1.5rem; text-transform: uppercase; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; display: flex; align-items: center; gap: 0.75rem;}
  .hero-eyebrow::before { content: ''; display: block; width: 30px; height: 2px; background: var(--accent-grad); border-radius: 2px; }
  .hero h1 { font-size: clamp(3rem, 6vw, 5rem); line-height: 1.1; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 2rem; color: #111827; }
  .hero h1 span { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero-sub { font-size: 1.15rem; color: var(--ink-2); max-width: 520px; line-height: 1.8; margin-bottom: 3.5rem; font-weight: 300; }
  .hero-cta { display: inline-flex; align-items: center; justify-content: center; padding: 1.2rem 3rem; background: var(--accent-grad); color: white; text-decoration: none; font-size: 1rem; font-weight: 600; border-radius: 50px; box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3); transition: all 0.3s; }
  .hero-cta:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 15px 40px rgba(79, 70, 229, 0.4); }
  
  .hero-visual { position: relative; display: flex; flex-direction: column; gap: 1.5rem; align-items: flex-end; }
  .hero-card { background: var(--surface); border: 1px solid rgba(0,0,0,0.03); box-shadow: 0 15px 50px rgba(0,0,0,0.04); border-radius: 20px; padding: 2rem; width: 85%; animation: float 6s ease-in-out infinite; }
  .hero-card:nth-child(2) { width: 75%; animation-delay: -2s; border-left: 4px solid var(--grad-1); }
  .hero-card:nth-child(3) { width: 95%; animation-delay: -4s; border-right: 4px solid var(--grad-2); }
  @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-15px) rotate(1deg); } }
  .card-label { font-size: 0.75rem; font-weight: 700; color: var(--ink-muted); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; }
  .card-title { font-size: 1.25rem; font-weight: 600; color: #111827; }
  .card-tags { display: flex; gap: 0.6rem; margin-top: 1rem; flex-wrap: wrap; }
  .card-tag { font-size: 0.75rem; font-weight: 500; padding: 6px 14px; background: var(--tag-bg-grad); border-radius: 50px; color: var(--grad-1); border: 1px solid rgba(79, 70, 229, 0.1); }

  section { padding: 8rem 4rem; max-width: 1060px; margin: 0 auto; }
  
  /* ========================================================= */
  /* 终极升级：全宽单列画板 (解决左右排版导致的拥挤与大面积留白) */
  /* ========================================================= */
  .resume-board {
    background: var(--surface);
    border-radius: 30px;
    padding: 5rem 6rem;
    box-shadow: 0 20px 60px rgba(0,0,0,0.03);
    border: 1px solid rgba(0,0,0,0.04);
  }

  .board-section {
    margin-bottom: 4rem;
  }
  .board-section:last-child {
    margin-bottom: 0;
  }

  .board-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: #111827;
    margin-bottom: 1.8rem;
    display: flex;
    align-items: center;
    gap: 0.75rem;
  }
  .board-title::before {
    content: '';
    display: block;
    width: 20px;
    height: 4px;
    background: var(--accent-grad);
    border-radius: 2px;
  }

  /* 关于我：横向铺开，不再局促 */
  .about-text {
    font-size: 1.05rem; 
    font-weight: 300; 
    color: var(--ink-2); 
    line-height: 1.9; 
  }
  .about-text p { margin-bottom: 1rem; }
  .about-text p:last-child { margin-bottom: 0; }
  .about-text strong { color: #111827; font-weight: 600; }

  /* 分割线 */
  .board-divider {
    height: 1px;
    background: repeating-linear-gradient(to right, rgba(0,0,0,0.05) 0, rgba(0,0,0,0.05) 8px, transparent 8px, transparent 16px);
    margin: 4rem 0;
    border: none;
  }

  /* 工作经历：宽幅排列，节省垂直高度 */
  .exp-list-new {
    display: flex;
    flex-direction: column;
    gap: 3rem; /* 条目之间的间距 */
  }
  
  .exp-item-new {
    position: relative;
    padding-left: 2rem;
  }
  
  /* 左侧贯穿的浅色轨道线 */
  .exp-item-new::before {
    content: '';
    position: absolute;
    left: 4px;
    top: 10px;
    bottom: -3rem; 
    width: 2px;
    background: rgba(79, 70, 229, 0.1);
  }
  .exp-item-new:last-child::before {
    display: none; /* 最后一个不延伸 */
  }
  
  /* 时间轴发光圆点 */
  .exp-item-new::after {
    content: '';
    position: absolute;
    left: -1px;
    top: 6px;
    width: 12px;
    height: 12px;
    background: var(--surface);
    border: 3px solid var(--grad-1);
    border-radius: 50%;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
  }

  /* 公司与时间左右对齐，最大化利用横向空间 */
  .exp-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center; 
    margin-bottom: 0.5rem;
    flex-wrap: wrap;
    gap: 1rem;
  }

  .exp-company-new {
    font-size: 1.3rem;
    font-weight: 700;
    color: #111827;
  }

  .exp-date-new {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--grad-1);
    background: var(--tag-bg-grad);
    padding: 4px 14px;
    border-radius: 50px;
    letter-spacing: 0.05em;
  }

  .exp-role-new {
    font-size: 1rem;
    font-weight: 600;
    color: var(--grad-2);
    margin-bottom: 1.2rem;
  }

  .exp-points-new {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 0.8rem;
  }

  .exp-points-new li {
    font-size: 1rem;
    font-weight: 300;
    color: var(--ink-2);
    line-height: 1.8;
    position: relative;
    padding-left: 1.2rem;
  }
  
  .exp-points-new li::before {
    content: '·';
    position: absolute;
    left: 0;
    top: -2px;
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--ink-muted);
    line-height: 1;
  }
  /* ========================================================= */

  .section-num { font-size: 0.9rem; font-weight: 700; color: var(--grad-2); margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; text-transform: uppercase; }
  .section-title { font-size: clamp(2.5rem, 4vw, 3rem); font-weight: 700; line-height: 1.2; margin-bottom: 4rem; color: #111827; position: relative; display: inline-block;}
  .section-title::after { content: ''; position: absolute; left: 0; bottom: -10px; width: 60px; height: 4px; background: var(--accent-grad); border-radius: 2px; }

  .works-single-column {
    display: flex;
    flex-direction: column;
    gap: 4rem; 
    max-width: 100%; 
    margin: 0 auto; 
  }

  .work-item { 
    display: flex; 
    flex-direction: column;
    width: 100%; 
    background: var(--surface);
    border-radius: 16px; 
    overflow: hidden; 
    text-decoration: none; 
    color: inherit; 
    border: 1px solid rgba(0,0,0,0.04);
    box-shadow: 0 8px 30px rgba(0,0,0,0.03);
  }
  
  .work-thumb { width: 100%; height: auto; overflow: hidden; border-bottom: 1px solid rgba(0,0,0,0.03); background: #F3F4F6; }
  .work-thumb img { width: 100%; height: auto; display: block; object-fit: contain; }
  
  .work-body { padding: 1.8rem; }
  .work-num-box { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1rem; }
  .work-num { font-size: 0.8rem; font-weight: 700; color: white; background: var(--accent-grad); padding: 2px 8px; border-radius: 4px;}
  .work-tag-main { font-size: 0.8rem; font-weight: 600; color: var(--grad-1); text-transform: uppercase;}
  .work-title { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.75rem; color: #111827; line-height: 1.3;}
  .work-desc { font-size: 0.95rem; color: var(--ink-2); font-weight: 300; line-height: 1.7; margin-bottom: 1.5rem;}
  .work-foot { padding-top: 1.2rem; border-top: 1px solid rgba(0,0,0,0.03); display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .wtag { font-size: 0.75rem; font-weight: 500; padding: 6px 14px; background: #F3F4F6; border-radius: 50px; color: var(--ink-2); }

  .contact-grid { 
    display: grid; grid-template-columns: 1fr 1.1fr; gap: 5rem; align-items: start; 
    background: linear-gradient(135deg, #ffffff 0%, rgba(79, 70, 229, 0.03) 100%);
    padding: 5rem; border-radius: 30px; box-shadow: 0 20px 70px rgba(0,0,0,0.04); border: 1px solid rgba(79, 70, 229, 0.08); 
  }
  .contact-intro { font-size: 1.3rem; font-weight: 300; color: var(--ink-2); line-height: 1.8; margin-bottom: 3rem; }
  .contact-intro strong { color: #111827; font-weight: 600; background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent;}
  .contact-items { display: flex; flex-direction: column; gap: 2rem; }
  .contact-item { display: flex; align-items: center; gap: 1.25rem; font-size: 1rem; color: #111827; font-weight: 500;}
  .ci-icon { width: 3rem; height: 3rem; background: var(--tag-bg-grad); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; color: var(--grad-1); font-weight: 700; border: 1px solid rgba(79, 70, 229, 0.05);}
  
  .form { display: flex; flex-direction: column; gap: 1.5rem; }
  .form label { font-size: 0.85rem; font-weight: 600; color: #111827; display: block; margin-bottom: 0.6rem; letter-spacing: 0.05em;}
  .form input, .form textarea { width: 100%; padding: 1.2rem; border: 1px solid #E5E7EB; border-radius: 12px; background: #FAFAFB; font-family: var(--sans); font-size: 1rem; color: #111827; outline: none; }
  .form textarea { height: 180px; resize: vertical; }
  .form-btn { align-self: flex-start; padding: 1.2rem 3.5rem; background: var(--accent-grad); color: white; border: none; border-radius: 50px; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 8px 25px rgba(79, 70, 229, 0.25); }

  footer { text-align: center; padding: 4rem 2rem; font-size: 0.9rem; color: var(--ink-muted); border-top: 1px solid rgba(0,0,0,0.02); margin-top: 2rem;}
  
  .fade-in { opacity: 1; transform: none; }

  @media (max-width: 1100px) {
    .hero { grid-template-columns: 1fr; gap: 3rem; padding: 10rem 2rem 4rem; text-align: center; }
    .hero-visual { display: none; }
    .hero-eyebrow { justify-content: center; }
    .hero-sub { margin: 0 auto 3.5rem; }
    nav { padding: 1rem 2rem; }
    .contact-grid { grid-template-columns: 1fr; gap: 4rem; padding: 3rem; }
  }
  @media (max-width: 768px) {
    section { padding: 5rem 2rem; }
